name: MISRA

on:
  push:
  pull_request:

jobs:
  misra:
    name: MISRA Analysis
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install tools
        run: |
          sudo apt-get update
          sudo apt-get install -y cppcheck gcc-arm-none-eabi cmake ninja-build

      - name: Configure
        run: |
          cmake -B build/release \
                -DCMAKE_BUILD_TYPE=Release \
                -DBOARD=nucleo_h753zi \
                -G Ninja

      - name: Run MISRA analysis
        run: cmake --build build/release --target cppcheck
